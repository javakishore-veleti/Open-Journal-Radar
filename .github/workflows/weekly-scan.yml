name: Weekly scan

on:
  schedule:
    - cron: '0 6 * * 1'        # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest began migrating to 26 on 2026-10-19
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check for API key
        run: |
          if [ -z "${{ secrets.OPENALEX_API_KEY }}" ]; then
            echo "::warning::OPENALEX_API_KEY secret is not set. OpenAlex shares one small daily budget per IP across all unauthenticated callers, and CI runners routinely exhaust it. Get a free key at https://openalex.org/settings/api and add it as a repository secret."
          fi

      - name: Run scan
        env:
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO || 'openalex@users.noreply.github.com' }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          STAMP=$(date -u +%Y-%m-%d-%H-%M)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          python3 tools/fetch_scan.py --out "scans/$STAMP" --db data/scan_ledger.db

      - name: Report
        run: |
          NEW=$(python3 -c "import json;print(len(json.load(open('scans/$STAMP/new-since-last-scan.json'))))")
          echo "NEW=$NEW" >> "$GITHUB_ENV"
          { echo "## Scan $STAMP"; echo; echo "**$NEW new papers**"; echo;
            sed -n '/## New since last scan/,$p' "scans/$STAMP/scan-summary.md"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit snapshot
        run: |
          if [ "$NEW" = "0" ]; then
            echo "No new papers; discarding empty snapshot."
            rm -rf "scans/$STAMP"
            git checkout -- data/scan_ledger.db 2>/dev/null || true
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "scans/$STAMP" data/scan_ledger.db
          git commit -m "scan $STAMP — $NEW new papers"
          git push
